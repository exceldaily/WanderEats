name: wanderbites
description: "WanderBites - social travel map for food discovery. Follow people with great taste, discover unforgettable places."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + DI
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Navigation
  go_router: ^16.0.0

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Backend
  supabase_flutter: ^2.9.0

  # Maps + location
  google_maps_flutter: ^2.12.0
  geolocator: ^14.0.0
  permission_handler: ^12.0.0

  # Networking (external providers only; Supabase has its own client)
  dio: ^5.7.0

  # Offline cache
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  shared_preferences: ^2.5.0

  # Media
  cached_network_image: ^3.4.0
  image_picker: ^1.1.0
  flutter_image_compress: ^2.4.0

  # Utilities
  intl: ^0.20.0
  collection: ^1.18.0

  # Firebase (push / analytics / crashlytics) is wired behind interfaces in
  # core/services with no-op dev fallbacks. Uncomment after running
  # `flutterfire configure` with a real Firebase project (see SETUP.md):
  # firebase_core: ^4.0.0
  # firebase_messaging: ^16.0.0
  # firebase_analytics: ^12.0.0
  # firebase_crashlytics: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^3.0.0
  drift_dev: ^2.26.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
