name: wanderbites
description: "WanderBites - social travel map for food discovery. Follow people with great taste, discover unforgettable places."
publish_to: 'none'

version: 1.0.3+16

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Referenced by adaptive widgets in the dependency tree; removing it makes
  # the release build warn about the missing CupertinoIcons font.
  cupertino_icons: ^1.0.8

  # State management + DI
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^16.0.0

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Backend
  supabase_flutter: ^2.9.0

  # Billing. RevenueCat validates receipts with Apple/Google and reports to
  # the revenuecat-webhook edge function, which is the only writer of
  # subscription state; this SDK is presentation + purchase UX, never truth.
  purchases_flutter: ^9.0.0

  # Maps + location
  google_maps_flutter: ^2.12.0
  geolocator: ^14.0.0

  shared_preferences: ^2.5.0

  # Media
  cached_network_image: ^3.4.0
  image_picker: ^1.1.0
  flutter_image_compress: ^2.4.0

  # Utilities
  intl: ^0.20.0
  url_launcher: ^6.3.0
  share_plus: ^12.0.0

  # Firebase (push / analytics / crashlytics), behind interfaces in
  # core/services. android/app/google-services.json is present (project
  # wanderbites-503816); real implementations activate at runtime whenever
  # that file exists, dev no-op fallback otherwise.
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# App icon generation. Every layer below is derived by tool/generate_icons.py
# from the single source file branding/source/wanderbites_globe.png, so
# changing the logo means replacing that one file and re-running:
#   python tool/generate_icons.py && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "branding/play_icon_512.png"
  image_path_ios: "branding/ios_icon_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FAF6F0"
  adaptive_icon_foreground: "branding/icon_foreground.png"
  adaptive_icon_monochrome: "branding/icon_monochrome.png"
