# WanderBites iOS build + TestFlight publish, on Codemagic's cloud Macs.
#
# UNVERIFIED: written from Codemagic's documented Flutter iOS recipe, but
# nobody on this project has a Mac, so this has never actually run. The first
# real signal is Codemagic's own build log on the first push - expect to
# paste an error back for a fix, the same way any first CI setup goes.
#
# One-time setup required in the Codemagic UI before this can build (none of
# this can be done from a repo file - it needs your Apple Developer account).
# On a Personal Account (not a Team), this lives under Settings > Integrations
# > Developer Portal, not "Teams > Integrations" as some Codemagic docs say.
#   1. [done] Sign up at codemagic.io, connect this GitHub repo.
#   2. [done] Apple Developer Program membership ($99/yr, developer.apple.com).
#   3. [done] Settings > Integrations > Developer Portal: connected an App
#      Store Connect API key, saved under the name "Codemagic" - matches the
#      `integrations.app_store_connect` value below. If you ever add a second
#      key or rename this one, update that value to match.
#   4. [done] Codemagic > this app > Environment variables: a group called
#      "wanderbites_prod" holding SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY,
#      SUPABASE_SCHEMA (same values as dart_defines/prod.json) and
#      GOOGLE_MAPS_API_KEY_IOS (a *new* Google Cloud key, iOS-restricted to
#      bundle id com.wanderbites.app - the Android key cannot be reused, its
#      restriction is Android-app-specific). Each marked "Secure".
#   5. [done] In App Store Connect, the app record itself: bundle id
#      com.wanderbites.app, matching android's package name.
#   6. [done] Settings > Code signing identities: a distribution certificate
#      saved as "wanderbites_distribution" (Generate certificate, type Apple
#      Distribution, using the API key above - Codemagic keeps the private key
#      on its side, so none of it has to be handled by hand), plus the App
#      Store provisioning profile saved as "wanderbites_appstore_profile".
#      NOTE: the workflow now uses automatic signing, so the stored profile
#      is no longer referenced. Kept in Codemagic for reference only.
#      (Historic) The profile itself had to be created in Apple's portal first
#      (developer.apple.com > Profiles > App Store), because Codemagic can
#      fetch profiles but cannot create them. Fetch profiles pulls it in after.
#
# This app is set to "codemagic.yaml" mode rather than the Workflow Editor;
# switching back to the editor makes Codemagic ignore this file entirely.
#
# After that, a push to main (or a manual run from the Codemagic dashboard)
# builds an .ipa and uploads it to TestFlight.

workflows:
  ios-testflight:
    name: WanderBites iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      # Automatic signing through the App Store Connect API key above, rather
      # than the hand-uploaded profile this used to reference by name.
      #
      # The named profile was captured once and then went stale: adding the
      # Sign in with Apple capability to the App ID left the stored profile
      # without the matching entitlement, and the build failed with
      # "Provisioning profile ... doesn't include the Sign In with Apple
      # capability". A stored profile cannot learn about a capability added
      # after it was downloaded, so that failure would repeat on every future
      # capability change.
      #
      # With distribution_type + bundle_identifier, Codemagic fetches or
      # regenerates the profile from Apple at build time, so it always carries
      # whatever the App ID currently has.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wanderbites.app
      groups:
        - wanderbites_prod
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter packages
        script: flutter pub get

      - name: CocoaPods install
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Write iOS Secrets.xcconfig
        script: |
          echo "GOOGLE_MAPS_API_KEY = $GOOGLE_MAPS_API_KEY_IOS" > ios/Flutter/Secrets.xcconfig

      # Applies the fetched profile to the Xcode project. Runs after pod
      # install, since CocoaPods regenerates the workspace this edits.
      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_SCHEMA="$SUPABASE_SCHEMA" \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY_IOS" \
            --dart-define=REVENUECAT_IOS_API_KEY=appl_yWEShWiSacjAPaXvIEPCnVHAIZG \
            --dart-define=APP_ENV=production \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Upload to App Store Connect, but do not queue an Apple Beta App
        # Review. Internal testers can install an uploaded build immediately
        # without any review, which covers day-to-day iteration; external
        # testing is the only thing that needs review, and that is a decision
        # worth making deliberately rather than as a side effect of pushing.
        #
        # This was true, which is how build 5 ended up "Waiting for Review"
        # without anyone choosing to submit it: once an external tester group
        # existed, every finished build started submitting itself.
        #
        # To ship to external testers: App Store Connect > TestFlight > the
        # external group > add the build > Submit for Review.
        submit_to_testflight: false
